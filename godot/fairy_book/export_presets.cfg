html/head_include="<!-- Yandex Games SDK (относительный путь — требование модерации) -->\n<script src=\"/sdk.js\"></script>\n<script>\nwindow.YB = {\n  sdk: null, pauseCb: null, resumeCb: null, ready: false,\n  init: function () {\n    if (!window.YaGames) { YB.ready = true; return; }\n    YaGames.init().then(function (s) {\n      YB.sdk = s; YB.ready = true;\n      if (s.on) {\n        s.on('game_api_pause', function () { if (YB.pauseCb) YB.pauseCb(); });\n        s.on('game_api_resume', function () { if (YB.resumeCb) YB.resumeCb(); });\n      }\n    }).catch(function () { YB.ready = true; });\n  },\n  available: function () { return !!(YB.sdk && YB.sdk.adv); },\n  loadingReady: function () { try { YB.sdk && YB.sdk.features.LoadingAPI && YB.sdk.features.LoadingAPI.ready(); } catch (e) {} },\n  gameplayStart: function () { try { YB.sdk && YB.sdk.features.GameplayAPI && YB.sdk.features.GameplayAPI.start(); } catch (e) {} },\n  gameplayStop: function () { try { YB.sdk && YB.sdk.features.GameplayAPI && YB.sdk.features.GameplayAPI.stop(); } catch (e) {} },\n  showFullscreen: function (cb) {\n    if (!YB.available()) { setTimeout(function () { cb(false); }, 0); return; }\n    var done = false; var fin = function (v) { if (!done) { done = true; cb(!!v); } };\n    try {\n      YB.sdk.adv.showFullscreenAdv({ callbacks: {\n        onClose: function (w) { fin(w); }, onError: function () { fin(false); }, onOffline: function () { fin(false); }\n      }});\n    } catch (e) { fin(false); }\n  },\n  showRewarded: function (cb) {\n    if (!YB.available()) { setTimeout(function () { cb('local'); }, 0); return; }\n    var rewarded = false; var done = false;\n    var fin = function () { if (!done) { done = true; cb(rewarded ? 'yes' : 'no'); } };\n    try {\n      YB.sdk.adv.showRewardedVideo({ callbacks: {\n        onRewarded: function () { rewarded = true; }, onClose: fin, onError: fin, onOffline: fin\n      }});\n    } catch (e) { fin(); }\n  },\n  /* липкий баннер: только вне геймплея (меню, лавка, рекорды) */\n  showBanner: function (cb) {\n    if (!YB.available() || !YB.sdk.adv.showBannerAdv) { setTimeout(function () { cb && cb(false); }, 0); return; }\n    try {\n      YB.sdk.adv.showBannerAdv().then(function (st) {\n        cb && cb(!st || st.stickyAdvIsShowing !== false);\n      }).catch(function () { cb && cb(false); });\n    } catch (e) { cb && cb(false); }\n  },\n  hideBanner: function () {\n    try { YB.sdk && YB.sdk.adv && YB.sdk.adv.hideBannerAdv && YB.sdk.adv.hideBannerAdv(); } catch (e) {}\n  }\n};\nYB.init();\ndocument.addEventListener('contextmenu', function (e) { e.preventDefault(); });\n</script>"

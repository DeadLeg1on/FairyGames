variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<!-- Yandex Games SDK (относительный путь — требование модерации) -->
<script src=\"/sdk.js\"></script>
<script>
window.YB = {
  sdk: null, pauseCb: null, resumeCb: null, ready: false,
  init: function () {
    if (!window.YaGames) { YB.ready = true; return; }
    YaGames.init().then(function (s) {
      YB.sdk = s; YB.ready = true;
      if (s.on) {
        s.on('game_api_pause', function () { if (YB.pauseCb) YB.pauseCb(); });
        s.on('game_api_resume', function () { if (YB.resumeCb) YB.resumeCb(); });
      }
    }).catch(function () { YB.ready = true; });
  },
  available: function () { return !!(YB.sdk && YB.sdk.adv); },
  loadingReady: function () { try { YB.sdk && YB.sdk.features.LoadingAPI && YB.sdk.features.LoadingAPI.ready(); } catch (e) {} },
  gameplayStart: function () { try { YB.sdk && YB.sdk.features.GameplayAPI && YB.sdk.features.GameplayAPI.start(); } catch (e) {} },
  gameplayStop: function () { try { YB.sdk && YB.sdk.features.GameplayAPI && YB.sdk.features.GameplayAPI.stop(); } catch (e) {} },
  showFullscreen: function (cb) {
    if (!YB.available()) { setTimeout(function () { cb(false); }, 0); return; }
    var done = false; var fin = function (v) { if (!done) { done = true; cb(!!v); } };
    try {
      YB.sdk.adv.showFullscreenAdv({ callbacks: {
        onClose: function (w) { fin(w); }, onError: function () { fin(false); }, onOffline: function () { fin(false); }
      }});
    } catch (e) { fin(false); }
  },
  showRewarded: function (cb) {
    if (!YB.available()) { setTimeout(function () { cb('local'); }, 0); return; }
    var rewarded = false; var done = false;
    var fin = function () { if (!done) { done = true; cb(rewarded ? 'yes' : 'no'); } };
    try {
      YB.sdk.adv.showRewardedVideo({ callbacks: {
        onRewarded: function () { rewarded = true; }, onClose: fin, onError: fin
      }});
    } catch (e) { fin(); }
  }
};
YB.init();
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
</script>"
html/canvas_resize_policy=2
